name: build-windows

on:
  workflow_dispatch:        # manual trigger (Run workflow button)
  push:
    tags: ['v*']           # auto-trigger on version tag

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest   # Microsoft-hosted Win VM

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --silent
          npm run build

      - name: Setup Python venv + deps
        working-directory: backend
        run: |
          python -m venv .venv-win
          .venv-win\Scripts\activate.bat
          python -m pip install --upgrade pip
          pip install -r ..\requirements.txt
          pip install -r ..\desktop\requirements-win.txt

      - name: Copy static assets + launcher
        working-directory: backend
        run: |
          if exist static rmdir /s /q static
          xcopy /e /i /y ..\frontend\dist static
          copy /y ..\desktop\desktop_launcher.py app\desktop_launcher.py

      # BUILD_DIST=1 = clean distribution build: NO seed bundled, friend sees empty DB
      - name: PyInstaller (clean distribution)
        working-directory: backend
        env:
          BUILD_DIST: '1'
        run: |
          call .venv-win\Scripts\activate.bat
          rmdir /s /q dist\WeightHealth 2>nul
          rmdir /s /q build 2>nul
          del /q WeightHealth.spec 2>nul
          pyinstaller ^
              --name "WeightHealth" ^
              --noconfirm ^
              --onedir ^
              --windowed ^
              --add-data "static;static" ^
              --add-data "schema.sql;." ^
              --hidden-import=sqlmodel ^
              --hidden-import=fastapi ^
              --hidden-import=uvicorn ^
              --hidden-import=uvicorn.loops.auto ^
              --hidden-import=uvicorn.protocols.http.auto ^
              --hidden-import=aiofiles ^
              --hidden-import=pydantic ^
              --hidden-import=webview ^
              --hidden-import=webview.platforms.edgechromium ^
              --hidden-import=webview.platforms.winforms ^
              --collect-all=app ^
              app\desktop_launcher.py

      - name: Download Inno Setup
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://jrsoftware.org/download.php/is.exe' -OutFile is.exe
          .\is.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          echo "ISCC=$env:ProgramFiles\Inno Setup 6\ISCC.exe" >> $env:GITHUB_ENV

      - name: Package installer
        run: |
          & "$env:ProgramFiles\Inno Setup 6\ISCC.exe" desktop\installer.iss
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item desktop\installer_output\*.exe artifacts\
          # Also bundle the one-folder build as a zip for users who don't need the installer
          Compress-Archive -Path backend\dist\WeightHealth -DestinationPath artifacts\WeightHealth-portable-x64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WeightHealth-Windows-x64
          path: |
            artifacts\*.exe
            artifacts\*.zip
          retention-days: 14

      - name: Attach to release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true   # safe default; you manually publish the release
