name: Build Windows Desktop App (Friend Edition)

on:
  push:
    branches: [main, v2-develop, feature/clean-build-pipeline]
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: frontend-dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install -g yarn --silent
          yarn install --frozen-lockfile
          yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-windows:
    needs: build-frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r backend\requirements.txt
          pip install -r desktop\requirements-win.txt

      - name: Prepare
        shell: powershell
        env:
          BUILD_DIST: '1'
        run: |
          New-Item -ItemType Directory -Force -Path backend\static
          Copy-Item -Recurse -Force frontend\dist\* backend\static\
          Copy-Item -Force desktop\desktop_launcher.py backend\app\
          # Only create seed_clean placeholder when NOT in clean dist mode
          if ($env:BUILD_DIST -ne '1') {
            New-Item -ItemType Directory -Force -Path backend\seed_clean
            Set-Content -Path backend\seed_clean\README.txt -Value "clean"
          }

      - name: Build exe
        shell: powershell
        env:
          # BUILD_DIST=1 = clean distribution: do NOT --add-data seed/, buyers get empty DB
          BUILD_DIST: '1'
        run: |
          cd backend
          if ($env:BUILD_DIST -eq '1') {
            Write-Host "[BUILD_DIST=1] Clean distribution - skipping seed/ to avoid leaking developer data"
            pyinstaller --name WeightHealth --onedir --windowed `
              --add-data "static;static" `
              --add-data "schema.sql;." `
              --hidden-import sqlmodel `
              --hidden-import fastapi `
              --hidden-import uvicorn `
              --hidden-import uvicorn.loops.auto `
              --hidden-import uvicorn.protocols.http.auto `
              --hidden-import aiofiles `
              --hidden-import pydantic `
              --hidden-import webview `
              --hidden-import webview.platforms.edgechromium `
              --hidden-import webview.platforms.winforms `
              --collect-all app `
              app\desktop_launcher.py
          } else {
            Write-Host "[BUILD_DIST unset] Developer build - including seed/"
            pyinstaller --name WeightHealth --onedir --windowed `
              --add-data "static;static" `
              --add-data "seed_clean;seed" `
              --add-data "schema.sql;." `
              --hidden-import sqlmodel `
              --hidden-import fastapi `
              --hidden-import uvicorn `
              --hidden-import uvicorn.loops.auto `
              --hidden-import uvicorn.protocols.http.auto `
              --hidden-import aiofiles `
              --hidden-import pydantic `
              --hidden-import webview `
              --hidden-import webview.platforms.edgechromium `
              --hidden-import webview.platforms.winforms `
              --collect-all app `
              app\desktop_launcher.py
          }

      - name: Build installer (Inno Setup)
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Package portable zip
        shell: powershell
        run: Compress-Archive -Path backend\dist\WeightHealth\* -DestinationPath WeightHealth-Windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WeightHealth-Windows-Installer
          path: desktop\installer_output\WeightHealth-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WeightHealth-Windows-Portable
          path: WeightHealth-Windows-portable.zip
