name: Build Windows Desktop App (Friend Edition)

on:
  push:
    branches: [main, v2-develop]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Python dependencies
        run: pip install pywebview pyinstaller aiofiles httpx fastapi uvicorn sqlmodel python-multipart

      - name: Build with batch script
        shell: cmd
        run: .\desktop\build-ci.bat

      - name: Package as ZIP
        run: Compress-Archive -Path backend\dist\WeightHealth-Friend\* -DestinationPath WeightHealth-Friend-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeightHealth-Friend-Windows
          path: WeightHealth-Friend-Windows.zip
